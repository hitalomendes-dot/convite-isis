<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Convite - Ísis Maria</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      background: url("imagens/isis.png") no-repeat left center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
    }
    .content {
      position: relative;
      width: 50%;
      padding: 20px;
      background: rgba(255, 192, 203, 0.6); /* leve rosa translúcido */
      border-radius: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
      margin: 0;
      color: #fff;
    }
    h2 {
      font-size: 1.8em;
      margin: 10px 0;
    }
    p {
      font-size: 1.1em;
      line-height: 1.4em;
    }
    .date-time {
      font-size: 1.3em;
      margin: 15px 0;
      font-weight: bold;
    }
    .buttons {
      margin-top: 20px;
    }
    .btn {
      display: inline-block;
      margin: 8px;
      padding: 12px 20px;
      background: #ff4081;
      color: #fff;
      border-radius: 25px;
      text-decoration: none;
      font-size: 1em;
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #f50057;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Ísis Maria</h1>
      <h2>1 aninho 🎀</h2>
      <p>
        No jardim mais doce da cidade, a Moranguinho<br>
        preparou uma festa encantada para celebrar um<br>
        momento muito especial…<br><br>
        Venha comemorar 1 aninho da nossa pequena Ísis Maria<br>
        com muita alegria, diversão e carinho!
      </p>
      <div class="date-time">📅 24/10/2026 — 🕒 14h</div>
      <div class="buttons">
        <a class="btn" href="https://www.google.com/maps/place/22%C2%B039'29.7%22S+46%C2%B059'47.3%22W/@-22.6582413,-46.9990577,17z/data=!3m1!4b1!4m4!3m3!8m2!3d-22.6582413!4d-46.9964828?hl=pt-BR" target="_blank">Localização</a>
        <a class="btn" href="https://forms.cloud.microsoft/r/ufVD6STkZc" target="_blank">Confirmação</a>
        <a class="btn" href="presente.html">Presentes</a>
      </div>
    </div>
  </div>
</body>
</html>
