<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Convite - 1º Aniversário da Ísis Maria</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(to bottom, #ffe6f0, #fff);
      color: #333;
      text-align: center;
      overflow-x: hidden;
    }
    section {
      padding: 40px 20px;
    }
    img.personagem {
      width: 80%;
      max-width: 400px;
      border-radius: 20px;
      margin-top: 20px;
      animation: fadeIn 2s ease;
    }
    h1 {
      font-size: 3em;
      color: #e91e63;
      margin-bottom: 10px;
      animation: fadeIn 2s ease;
    }
    h2 {
      font-size: 2em;
      color: #c2185b;
      margin-bottom: 20px;
      animation: fadeIn 3s ease;
    }
    p {
      font-size: 1.2em;
      line-height: 1.5em;
      animation: fadeIn 4s ease;
    }
    .date-time {
      font-size: 1.5em;
      color: #d32f2f;
      margin: 20px 0;
      font-weight: bold;
      animation: fadeIn 5s ease;
    }
    .buttons {
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      background: #ff4081;
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1.1em;
      transition: transform 0.2s ease;
      animation: fadeIn 6s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #f50057;
    }
    .footer {
      margin-top: 40px;
      font-size: 1.2em;
      color: #444;
      animation: fadeIn 7s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
