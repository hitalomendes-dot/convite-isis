<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sugestão de Presente - Ísis Maria</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(to bottom, #fff0f5, #fff);
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.5em;
      color: #e91e63;
      margin-bottom: 20px;
      animation: fadeIn 2s ease;
    }
    ul {
      list-style: none;
      padding: 0;
      font-size: 1.3em;
      line-height: 2em;
      animation: fadeIn 3s ease;
    }
    li::before {
      content: "🍓 ";
    }
    a.btn {
      display: inline-block;
      margin: 15px;
      padding: 15px 25px;
      background: #ff4081;
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1.1em;
      transition: transform 0.2s ease;
      animation: fadeIn 4s ease;
    }
    a.btn:hover {
      transform: scale(1.05);
      background: #f50057;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Sugestão de Presente 🎁</h1>
  <ul>
    <li>Roupa tamanho 2 anos</li>
    <li>Sapatinho tamanho 22 a 26</li>
    <li>Brinquedos educativos</li>
  </ul>
  <div>
    <a class="btn" href="isis.html">Voltar ao Convite</a>
  </div>
</body>
</html>
